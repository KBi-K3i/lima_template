# rocky-podman.yaml — Rocky Linux 10 (aarch64) + Podman rootless + docker-compose
# 使い方: limactl start --name=rocky-podman https://raw.githubusercontent.com/KBi-K3i/lima_template/main/rocky-podman.yaml
# （社内 GitLab 等で配る場合は、その raw URL に差し替える。詳細は README）

vmType: vz                 # Apple Virtualization（macOS 13+）。QEMU で固めるなら vz → qemu（README の選び分け表）
rosetta:                   # ※vz 専用。vmType: qemu のときは無効（x86 は qemu-user の binfmt 等で代替）
  enabled: true            # arm64 VM 内で x86_64 コンテナを Rosetta で動かせるように
  binfmt: true

cpus: 4
memory: "8GiB"
disk: "128GiB"

# Rocky 10 aarch64 の公式クラウドイメージ（バージョン固定＋ダイジェストで再現性を担保）
# 新しいポイントリリースが出たら location と digest を更新する（README「イメージのバージョン固定と更新運用」）
images:
  - location: "https://dl.rockylinux.org/pub/rocky/10/images/aarch64/Rocky-10-GenericCloud-Base-10.2-20260525.0.aarch64.qcow2"
    arch: "aarch64"
    digest: "sha256:457c8375e19496f43a25c4a6169fa11237536c53cef6f85a20ea3c5a751aa0f5"

# ~ はひとまず読み取り専用でマウント（必要なら作業用に writable: true の別マウントを足す）
mounts:
  - location: "~"
    writable: false

# VM の 8080/8443 を Mac の localhost へ転送（リバースプロキシ等の動作確認用）
portForwards:
  - guestPort: 8080
    hostPort: 8080
  - guestPort: 8443
    hostPort: 8443

# 初期構築：root 権限の部分と、一般ユーザー権限（rootless）の部分に分ける
provision:
  - mode: system
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      dnf -y update
      dnf -y install podman git curl tar
  - mode: user
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      if ! grep -q "^$(id -un):" /etc/subuid 2>/dev/null; then
        sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(id -un)"
        podman system migrate || true
      fi
      COMPOSE_VER="$(curl -s https://api.github.com/repos/docker/compose/releases/latest | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')"
      sudo curl -L "https://github.com/docker/compose/releases/download/${COMPOSE_VER}/docker-compose-linux-aarch64" -o /usr/local/bin/docker-compose
      sudo chmod +x /usr/local/bin/docker-compose
      sudo loginctl enable-linger "$(id -un)"
      export XDG_RUNTIME_DIR="/run/user/$(id -u)"
      systemctl --user enable --now podman.socket
      grep -q 'DOCKER_HOST=' ~/.bashrc || echo 'export DOCKER_HOST=unix://${XDG_RUNTIME_DIR}/podman/podman.sock' >> ~/.bashrc
